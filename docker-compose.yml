# EchoHub v2 — orchestration locale.
#
# Cible : Windows 11 + Docker Desktop + WSL2. C'est ce qui détermine la syntaxe GPU ci-dessous,
# et elle est INVERSÉE d'une plateforme à l'autre (cf. COMPATIBILITE-GPU.md) :
#
#   Windows + Docker Desktop + WSL2 → deploy.resources.reservations.devices  (forme active ici)
#                                      `nvidia.com/gpu=all` échoue : "unresolvable CDI devices"
#   Linux natif avec CDI seul       → devices: ["nvidia.com/gpu=all"]
#                                      `--gpus all` échoue : "AMD CDI spec not found"
#
# Passer d'une machine à l'autre = permuter les deux blocs, rien d'autre.
name: echohub

services:
  echohub:
    build:
      context: .
      dockerfile: Dockerfile
    # Tag distinct de la v1 (`echohub:gpu`) : les deux images coexistent tant que la v2 n'est pas
    # validée de bout en bout. Elles se disputent en revanche les ports et le GPU — une seule à la fois.
    image: echohub:v2
    container_name: echohub-v2
    restart: unless-stopped

    # --- GPU : forme Windows/WSL2, inactive ici — cette machine est Linux natif (Arch), CDI ---
    # `--gpus all` (équivalent de la forme deploy.resources ci-dessous) échoue sur cette machine :
    # "AMD CDI spec not found" (COMPATIBILITE-GPU.md, confirmé MESURES-MOE.md 2026-08-15).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # --- GPU : forme Linux natif + CDI, ACTIVE sur cette machine ----------------------------
    devices:
      - nvidia.com/gpu=all

    # torch (vLLM) alloue en mémoire partagée. Le défaut Docker est de 64 Mo, insuffisant dès
    # qu'un worker démarre : l'échec se présente comme un plantage obscur, pas comme un manque
    # de place.
    shm_size: "2gb"

    ports:
      # Distincts de la v1 (37820/37821) : les deux versions peuvent tourner en même temps sur
      # le même hôte sans se disputer un port (mesuré : bind KO côté v2, servi par la v1).
      - "${ECHOHUB_PORT_WEB:-37920}:80"          # interface web (nginx)
      # Liée à 127.0.0.1 : ce port court-circuite nginx, donc l'authentification HTTP posée
      # devant l'interface. Sans cette liaison, toute machine du réseau local pilotait l'API
      # sans le moindre identifiant (vérifié : /models/registre répondait en clair). Le tunnel ne la
      # routait déjà pas, mais le LAN, lui, l'atteignait. Reste joignable en débogage depuis
      # cette machine (curl 127.0.0.1:37921), injoignable depuis toute autre origine.
      - "127.0.0.1:${ECHOHUB_PORT_API:-37921}:37921"  # API FastAPI directe, débogage local uniquement

    volumes:
      # Volumes nommés : MODELS_DIR et XDG_DATA_HOME pointent DEDANS (cf. Dockerfile). Tout ce
      # que le backend écrit ailleurs est perdu à la reconstruction de l'image.
      - echohub_models:/data/models              # modèles téléchargés (des dizaines de Go)
      # Lot L7 (MESURES-MOE.md) montait ici /mnt/models/echohub en lecture seule : c'est un chemin
      # de la machine Arch Linux, inexistant sous Windows — Docker Desktop créerait un dossier vide
      # et le registre de modèles se retrouverait sans rien. Le volume nommé reste la forme locale.
      # - /mnt/models/echohub:/data/models:ro
      - echohub_userdata:/data/user              # base SQLite, configuration, journaux
      # Espaces de travail des conversations, PARTAGÉS avec le conteneur atelier (même volume monté
      # sur /workspace là-bas). C'est ce partage qui fait qu'un fichier écrit par `ecrire_fichier`
      # est visible du shell de l'atelier, et qu'un fichier produit par une commande est balayé et
      # rattaché à la conversation. Distinct de userdata : l'atelier ne voit ni la base ni les secrets.
      - ${ECHOHUB_ATELIERS_HOTE:-echohub_ateliers}:/data/ateliers
      # Racine des PROJETS confiables à une conversation (mode projet), montée au MÊME endroit
      # logique dans l'atelier (/projets). Dossier de l'hôte choisi dans le .env ; le défaut reste
      # sous ce dépôt (ignoré par git) pour ne jamais exposer un dossier que personne n'a désigné.
      - ${ECHOHUB_PROJETS_HOTE:-./projets}:/projets

      # Modèles des bancs d'agent-forge, en LECTURE SEULE, montés comme un dépôt supplémentaire.
      # Le nom de dossier suit la convention `<org>--<repo>` de storage.py::nom_dossier ; les GGUF
      # qui s'y trouvent à plat apparaissent alors comme les variantes de ce dépôt, ce que
      # `fichiers_gguf` sait déjà présenter. Aucune copie : ce sont des dizaines de Go.
      # Chemin d'une machine Linux : sous Windows, Docker Desktop créera un dossier vide et le
      # dépôt s'affichera sans variante — sans effet sur les modèles du volume nommé.
      - "${FORGE_MODELS_DIR:-/mnt/models/agent-forge}:/data/models/agent-forge--bancs:ro"

      # --- Développement : code monté depuis l'hôte -------------------------------------
      # Actif : le harnais évolue au rythme des sessions d'usage, et reconstruire l'image coûte
      # ~16 min dominées par la compilation CUDA de llama-cpp-python. `docker compose restart
      # echohub` suffit désormais à prendre un changement de backend.
      # Le volume anonyme sur .venv est INDISSOCIABLE du bind mount : sans lui, un venv Windows
      # présent sur l'hôte masquerait le venv Linux de l'image, et le llama-cpp-python compilé
      # pour CUDA disparaîtrait purement et simplement.
      - ./backend:/app/backend
      - /app/backend/.venv
      # Le `dist` construit sur l'hôte, servi par nginx. Sans lui, l'interface reste celle de
      # l'image : un changement de frontend resterait invisible malgré un `bun run build` réussi —
      # le symptôme le plus coûteux à diagnostiquer, parce que tout paraît avoir fonctionné.
      # En ÉCRITURE, et ce n'est pas un relâchement : l'entrypoint marque `index.html` d'une
      # empreinte `?v=` à chaque démarrage, sans laquelle un déploiement reste invisible derrière
      # le cache du navigateur. Monté en lecture seule, `sed -i` échoue et le conteneur redémarre
      # en boucle. Le fichier touché est un artefact de build, régénéré à chaque `bun run build`.
      - ./frontend/dist:/app/frontend/dist

      # Binaire llama-server, compilé pour l'architecture de cette carte (sm_86). Monté depuis
      # l'hôte plutôt que copié dans l'image pour une raison de fait : celui de
      # `ghcr.io/ggml-org/llama.cpp` est lié à la glibc d'Ubuntu 24.04 et cette image est sur 22.04
      # (mesuré : « GLIBC_2.38 not found »), il faut donc le compiler ici — 10 min de CUDA qu'on ne
      # veut pas payer à chaque reconstruction d'image pendant la mise au point.
      # Absent : le superviseur retombe seul sur les bindings Python, sans rien casser.
      - "${ECHOHUB_LLAMA_SERVER_HOTE:-/mnt/models/echohub-bin/llama-server}:/opt/llama-server/llama-server:ro"

    environment:
      MODELS_DIR: /data/models
      XDG_DATA_HOME: /data/user
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_TOKEN: ${HF_TOKEN:-}
      # Authentification HTTP de l'interface, posée par docker/entrypoint.sh. Vides = aucune
      # authentification, comportement d'origine. Générer le couple avec docker/outils-acces.py :
      # le mot de passe n'existe qu'à l'écran, seul son empreinte crypt salée passe par ici.
      ECHOHUB_AUTH_USER: ${ECHOHUB_AUTH_USER:-}
      ECHOHUB_AUTH_HASH: ${ECHOHUB_AUTH_HASH:-}
      # Nom de service Docker, résolu par le DNS interne du réseau de la pile. Le domaine
      # `recherche` lit cette variable via backend/core/config.py — rien n'est codé en dur.
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      # Atelier d'exécution : le backend lui délègue commandes et code Python par HTTP, sur le
      # réseau interne (jamais un port publié). Le jeton partagé garde ce service qui exécute du
      # shell root ; il vient du .env, jamais du code. ATELIER_WORKSPACE désigne le point de montage
      # du volume PARTAGÉ avec l'atelier — un fichier écrit ici est vu des deux côtés.
      ATELIER_URL: ${ATELIER_URL:-http://echohub-atelier:8080}
      ATELIER_JETON: ${ATELIER_JETON:-}
      ATELIER_WORKSPACE: /data/ateliers
      ECHOHUB_PROJETS_RACINE: /projets
      # GGML_CUDA_ENABLE_UNIFIED_MEMORY est volontairement ABSENTE : sous WSL2 elle immobilise
      # le modèle en RAM avec la VRAM figée à 2 Go (mesuré). ggml active le comportement sur la
      # simple présence de la variable — une valeur vide suffirait à nuire. L'entrypoint la
      # retire même si l'environnement hôte la transmet.

    healthcheck:
      # Interroge nginx, pas une route d'API : la page statique existe dès le premier démarrage,
      # ce qui donne un signal fiable sans dépendre de l'avancement du backend.
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- Recherche web, désormais active ------------------------------------------------------
  # Le profil `recherche-web` qui laissait ce service éteint a été retiré : il démarre avec la
  # pile. Toujours aucun port publié — `expose` ne l'ouvre que sur le réseau interne, où le
  # backend l'atteint sur http://searxng:8080. Rien n'est joignable depuis l'hôte ni l'extérieur.
  #
  # Pas de `depends_on` côté echohub, volontairement : le backend doit démarrer et servir même si
  # la recherche est indisponible. Son domaine `recherche` rend alors une erreur métier explicite
  # (503) et sa sonde /api/recherche/sante dit ce qui a été mesuré.
  searxng:
    image: searxng/searxng:latest
    container_name: echohub-searxng
    restart: unless-stopped
    volumes:
      # Le volume nommé reste monté sur tout /etc/searxng : l'image y écrit ce dont elle a besoin
      # (ownership, fichiers dérivés). Notre configuration est superposée PAR-DESSUS, en lecture
      # seule, sur le seul fichier qui nous intéresse — Docker applique les montages du chemin le
      # plus court au plus long, donc le fichier gagne sur le volume.
      # Sa présence empêche aussi l'entrypoint d'en régénérer un par défaut, dans lequel le format
      # JSON serait à nouveau désactivé.
      - echohub_searxng:/etc/searxng
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      # SearXNG refuse de démarrer sans clé. La valeur du fichier de configuration sert de repli ;
      # celle-ci prime lorsque l'image gère la variable. Enjeu faible : instance non publiée.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-echohub-v2-instance-locale-non-publiee}
      # Redondant avec settings.yml, et c'est le but : le limiteur rejette les appels
      # programmatiques et réclame un Valkey. Les deux voies de réglage doivent dire la même chose.
      SEARXNG_LIMITER: "false"
    expose:
      - "8080"

  # --- Atelier d'exécution ------------------------------------------------------------------
  # Conteneur de dev persistant, unique et partagé par TOUTES les conversations (option B). L'agent
  # y est root, avec réseau et un vrai toolchain, et il installe le reste lui-même (`apt`, `pip`).
  # L'isolation vis-à-vis de la machine de Chris vient de la frontière du conteneur, pas de
  # privilèges abaissés :
  #   - AUCUN chemin de l'hôte monté (pas de /, pas de home, pas de docker.sock) — seul le volume
  #     nommé `echohub_ateliers` est visible, partagé avec le backend ;
  #   - ressources bornées (mem_limit, cpus, pids_limit) pour qu'une commande folle ne noie pas la
  #     machine ;
  #   - aucun port publié : `expose` ne l'ouvre que sur le réseau interne, où seul le backend l'atteint.
  #
  # Persistance : le VOLUME ne couvre que /workspace (fichiers des conversations et tout ce que
  # l'agent y dépose, un venv compris). Les paquets installés par `apt` vont dans /usr, HORS volume :
  # ils survivent aux redémarrages (`restart`, `compose restart`) car le conteneur reste le même,
  # mais un rebuild de l'atelier (`compose build`/`down`) les efface — refaire alors un `apt install`
  # est acceptable. Ce qui ne l'était pas, c'est de les perdre à chaque message : ce n'est plus le cas.
  echohub-atelier:
    build:
      context: ./atelier
      dockerfile: Dockerfile
    image: echohub-atelier:v2
    container_name: echohub-atelier
    restart: unless-stopped
    environment:
      # Volume partagé, vu ici sous /workspace et sous /data/ateliers côté backend : même contenu.
      ATELIER_WORKSPACE: /workspace
      # Jeton partagé avec le backend : sans lui, l'exécution est refusée (repli fermé, cf. serveur.py).
      ATELIER_JETON: ${ATELIER_JETON:-}
      ATELIER_PROJETS: /projets
      # « uid:gid » de l'utilisateur de l'hôte : ce que l'agent (root) crée dans un dossier monté
      # lui est rétrocédé. Indispensable en mode natif, où le backend n'est pas root.
      ATELIER_PROPRIETAIRE: ${ATELIER_PROPRIETAIRE:-}
    volumes:
      # Nom de volume par défaut ; en mode NATIF, chemin de l'hôte = celui du backend natif
      # (ATELIER_WORKSPACE), pour que les deux voient les mêmes fichiers.
      - ${ECHOHUB_ATELIERS_HOTE:-echohub_ateliers}:/workspace
      # La SEULE fenêtre sur l'hôte : la racine des projets. Un projet confié à une conversation
      # y est un sous-dossier ; les garde-fous refusent d'en sortir.
      - ${ECHOHUB_PROJETS_HOTE:-./projets}:/projets
    # Garde-fous : une commande de l'agent ne doit pas pouvoir asphyxier l'hôte. Généreux mais bornés.
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 512
    expose:
      - "8080"
      - "8090"
    # Publié sur 127.0.0.1 SEULEMENT, pour le backend en mode natif (ATELIER_URL=http://127.0.0.1:…).
    # Jamais joignable depuis le réseau local, et chaque exécution reste gardée par le jeton.
    ports:
      - "127.0.0.1:${ATELIER_PORT_HOTE:-37923}:8080"
      # Relais d'aperçu (`atelier/apercu.py`) : l'app que l'agent fait tourner, ouverte dans le navigateur.
      - "127.0.0.1:${ATELIER_APERCU_PORT_HOTE:-37924}:8090"

volumes:
  echohub_models:
  echohub_userdata:
  echohub_searxng:
  # Espaces de travail des conversations, partagés backend <-> atelier (voir les deux services).
  echohub_ateliers:
